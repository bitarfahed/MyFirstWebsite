<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מערכת ניהול אנשים</title>
    <!-- חיבור לקובץ העיצוב -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>מערכת ניהול אנשים</h1>

        <!-- סרגל כפתורים ראשי -->
        <div class="actions-bar">
            <button id="toggle-list-btn" onclick="togglePeopleList()">Show</button>
            <button id="show-form-btn" onclick="showAddForm()">Add</button>
        </div>

        <!-- טופס הוספת אדם חדש (מוסתר כברירת מחדל) -->
        <div id="add-form-container" class="form-container hidden">
            <h2>הוספת אדם חדש</h2>
            
            <div class="form-group">
                <label for="person-name">שם פרטי (אותיות בלבד):</label>
                <input type="text" id="person-name" placeholder="הכנס שם...">
            </div>

            <div class="form-group">
                <label for="person-age">גיל (0-100):</label>
                <input type="number" id="person-age" min="0" max="100" placeholder="הכנס גיל...">
            </div>

            <div class="form-group">
                <label>מין:</label>
                <div class="radio-group">
                    <label><input type="radio" name="gender" value="זכר" checked> זכר</label>
                    <label><input type="radio" name="gender" value="נקבה"> נקבה</label>
                </div>
            </div>

            <div class="form-group">
                <label for="person-country">מדינה:</label>
                <select id="person-country">
                    <option value="Israel">ישראל (Israel)</option>
                    <option value="US">ארצות הברית (US)</option>
                    <option value="UK">בריטניה (UK)</option>
                </select>
            </div>

            <div class="form-buttons">
                <button class="send-btn" onclick="sendNewPerson()">Send</button>
                <button class="cancel-btn" onclick="hideAddForm()">ביטול</button>
            </div>
        </div>

        <!-- אזור הצגת רשימת האנשים (מוסתר כברירת מחדל) -->
        <div id="people-list-container" class="list-container hidden">
            <h2>רשימת אנשים במערכת</h2>
            <div id="people-list"></div>
        </div>
    </div>

    <!-- חיבור לקובץ ה-JavaScript בסוף ה-body -->
    <script src="script.js"></script>
</body>
</html>
